services:
  - type: web
    name: padhaizone
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
    disk:
      name: padhaizone-data
      mountPath: /opt/render/project/src
      sizeGB: 1
